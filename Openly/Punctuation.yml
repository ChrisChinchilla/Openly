---
extends: substitution
message: "Use '%s' instead of '%s'"
level: warning
nonword: true
action:
  name: replace
swap:
  # Always followed by a comma. The lookahead stops the fix swallowing an existing one.
  '\be\.g\.(?!,)': 'e.g.,'
  '\bi\.e\.(?!,)': 'i.e.,'
  '\beg\b(?!,)': 'e.g.,'
  '\bie\b(?!,)': 'i.e.,'
