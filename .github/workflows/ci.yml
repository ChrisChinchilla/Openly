name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  VALE_VERSION: 3.25.1
  # SHA-256 of vale_${VALE_VERSION}_Linux_64-bit.tar.gz, from the release's checksums file.
  VALE_SHA256: 4bf5c5176b682b1da0830f471584d3494f1c2e27ee3029e1ad6f6661d4962182

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Vale
        run: |
          archive="vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          curl -fsSLO "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/${archive}"
          echo "${VALE_SHA256}  ${archive}" | sha256sum --check
          mkdir bin && tar -xzf "${archive}" -C bin
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Lint rule files
        run: pipx run yamllint==1.37.1 -c .yamllint.yml Openly

      - name: Run rule tests
        run: tests/run.sh
